[package]
name = "mediamtx-mcp-tray"
version = "0.1.0"
description = "MediaMTX MCP tray app"
authors = ["iamjairo"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "mediamtx_mcp_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
which = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
