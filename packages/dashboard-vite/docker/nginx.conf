server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path resolves to index.html so the React
    # Router catches it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config served as JS so the SPA can read it before bootstrapping.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    # Cache hashed asset bundles aggressively.
    location ~* \.(?:js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
